backend:
  name: git-gateway
  branch: main

locale: ja
media_folder: images
public_folder: images
editor:
  preview: false

collections:

  # ---- About ページ ----
  - name: about
    label: About（バンド紹介）
    files:
      - name: about
        label: バンド紹介テキスト
        file: data/about.json
        fields:
          - label: 見出し
            name: heading
            widget: string
          - label: 本文（段落ごとに追加）
            name: paragraphs
            widget: list
            field:
              label: 段落
              name: paragraph
              widget: text
          - label: 沿革（箇条書き）
            name: highlights
            widget: list
            field:
              label: 項目
              name: item
              widget: string
          - label: Philosophy 見出し
            name: philosophy_heading
            widget: string
          - label: Philosophy 本文
            name: philosophy_paragraphs
            widget: list
            field:
              label: 段落
              name: paragraph
              widget: text

  # ---- Live 情報 ----
  - name: lives
    label: Live（ライブ情報）
    files:
      - name: lives
        label: ライブスケジュール
        file: data/lives.json
        fields:
          - label: Upcoming（予定）
            name: upcoming
            widget: list
            fields:
              - { label: 日付 (YYYY-MM-DD), name: date, widget: string }
              - { label: 月 (例:Mar), name: month, widget: string }
              - { label: 日 (例:27), name: day, widget: string }
              - { label: 年 (例:2027), name: year, widget: string }
              - { label: イベント名, name: title, widget: string }
              - { label: 会場, name: venue, widget: string }
              - { label: 開場時間, name: open, widget: string, default: "未定" }
              - { label: 開演時間, name: start, widget: string, default: "未定" }
              - { label: 料金, name: charge, widget: string, default: "¥1,000 + 1drink" }
              - { label: フライヤー画像, name: flyer, widget: image, required: false }
          - label: Past（過去公演）
            name: past
            widget: list
            fields:
              - { label: 日付 (YYYY-MM-DD), name: date, widget: string }
              - { label: 月 (例:Nov), name: month, widget: string }
              - { label: 日 (例:08), name: day, widget: string }
              - { label: 年 (例:2025), name: year, widget: string }
              - { label: イベント名, name: title, widget: string }
              - { label: 会場, name: venue, widget: string }
              - { label: 備考, name: note, widget: string, default: "終演済み" }
  - name: members
    label: Members（メンバー紹介）
    files:
      - name: saxophone
        label: Saxophone セクション
        file: data/members.json
        fields:
          - label: Saxophone メンバー
            name: saxophone
            widget: list
            fields:
              - { label: 名前, name: name, widget: string }
              - { label: パート, name: role, widget: string }
              - { label: 紹介文, name: bio, widget: text }
              - { label: 写真, name: photo, widget: image, required: false }
          - label: Trumpet メンバー
            name: trumpet
            widget: list
            fields:
              - { label: 名前, name: name, widget: string }
              - { label: パート, name: role, widget: string }
              - { label: 紹介文, name: bio, widget: text }
              - { label: 写真, name: photo, widget: image, required: false }
          - label: Trombone メンバー
            name: trombone
            widget: list
            fields:
              - { label: 名前, name: name, widget: string }
              - { label: パート, name: role, widget: string }
              - { label: 紹介文, name: bio, widget: text }
              - { label: 写真, name: photo, widget: image, required: false }
          - label: Rhythm メンバー
            name: rhythm
            widget: list
            fields:
              - { label: 名前, name: name, widget: string }
              - { label: パート, name: role, widget: string }
              - { label: 紹介文, name: bio, widget: text }
              - { label: 写真, name: photo, widget: image, required: false }

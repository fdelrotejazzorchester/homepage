  <script>
    // about.json を読み込んでページに反映
    fetch('data/about.json')
      .then(r => r.json())
      .then(d => {
        // 左カラム：見出し・本文・ハイライト
        const left = document.getElementById('about-left');
        left.innerHTML =
          `<h2 style="font-size:1.6rem;margin-bottom:20px;">${d.heading}</h2>` +
          d.paragraphs.map(p => `<p>${p}</p>`).join('') +
          `<ul class="about-highlights">` +
          d.highlights.map(h => `<li>${h}</li>`).join('') +
          `</ul>`;

        // 右カラム：フィロソフィー
        const right = document.getElementById('about-right');
        right.insertAdjacentHTML('beforeend',
          `<h2 style="font-size:1.2rem;margin-bottom:16px;">${d.philosophy_heading}</h2>` +
          d.philosophy_paragraphs.map(p =>
            `<p style="color:rgba(240,236,228,.75);">${p}</p>`
          ).join('')
        );

        // コンテンツ生成後にアニメーションを再適用
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });

        document.querySelectorAll('.slide-left, .slide-right').forEach(el => {
          observer.observe(el);
        });
      });
  </script>

  <script src="script.js"></script>
  <script>
    // members.json を読み込んでカードを生成
    fetch('data/members.json')
      .then(r => r.json())
      .then(data => {
        const sections = ['saxophone', 'trumpet', 'trombone', 'rhythm'];
        sections.forEach(section => {
          const grid = document.getElementById('grid-' + section);
          if (!grid) return;
          data[section].forEach((member, i) => {
            const dir = i % 2 === 0 ? 'slide-left' : 'slide-right';
            const photo = member.photo
              ? `<img src="${member.photo}" alt="${member.name}" style="width:100%;aspect-ratio:1;object-fit:cover;margin-bottom:16px;">`
              : `<div class="dummy-img" style="aspect-ratio:1;margin-bottom:16px;">[ Photo ]</div>`;
            grid.insertAdjacentHTML('beforeend', `
              <div class="card ${dir}">
                ${photo}
                <p class="role">${member.role}</p>
                <h3>${member.name}</h3>
                <p style="font-size:.85rem;color:var(--gray);">${member.bio}</p>
              </div>
            `);
          });
        });

        // カード生成後にアニメーション監視を再実行
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const siblings = entry.target.parentElement
                ? [...entry.target.parentElement.children].filter(el =>
                    el.classList.contains('slide-left') || el.classList.contains('slide-right'))
                : [];
              const idx = siblings.indexOf(entry.target);
              entry.target.style.transitionDelay = `${idx * 0.1}s`;
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });

        document.querySelectorAll('.card.slide-left, .card.slide-right').forEach(el => {
          observer.observe(el);
        });
      });
  </script>
